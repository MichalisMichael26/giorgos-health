# OPTIONAL EXAMPLE ONLY — do not merge blindly with the active Render Blueprint.
# Configure the S3/R2 environment variables on a scheduled Render job and run:
#   python manage.py cloud_backup
#
# A daily example:
services:
  - type: cron
    name: giorgos-health-daily-backup
    runtime: python
    schedule: "15 2 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py cloud_backup"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        value: auto
