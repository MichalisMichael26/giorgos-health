{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card">
    <h1>{{ title }}</h1>
    <p>Είσαι σίγουρος ότι θέλεις να διαγραφεί αυτή η καταχώρηση;</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn danger" type="submit">Ναι, διαγραφή</button>
        <a class="btn secondary" href="javascript:history.back()">Ακύρωση</a>
    </form>
</div>
{% endblock %}
