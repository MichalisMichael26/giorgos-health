{% load static %}
<!doctype html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Giorgos Health{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="kids-bg">
<div class="floating-shape shape-1"></div>
<div class="floating-shape shape-2"></div>
<div class="floating-shape shape-3"></div>

<header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">
        <img src="{% static 'images/logo.png' %}" alt="Giorgos Health Logo" class="brand-logo">
        <div class="brand-text">
            <span class="brand-title">Giorgos Health</span>
            <span class="brand-subtitle">Healthy Days · Brighter Tomorrows</span>
        </div>
    </a>

    {% if user.is_authenticated %}
    <nav>
        <a href="{% url 'dashboard' %}">Αρχική</a>
        <a href="{% url 'meal_list' %}">Γεύματα</a>
        <a href="{% url 'glucose_list' %}">Γλυκόζη</a>
        <a href="{% url 'growth_list' %}">Ανάπτυξη</a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}
            <button type="submit" class="link-button">Έξοδος</button>
        </form>
    </nav>
    {% endif %}
</header>

<main class="container">
    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
