{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card pediatric-entry-form" id="entry-form-card" data-new-meal-route-defaults="{% if new_meal_route_defaults %}true{% else %}false{% endif %}">
    <div class="pediatric-form-heading">
        <span class="pediatric-form-icon" id="pediatric-form-icon">✨</span>
        <div>
            <h1>{{ title }}</h1>
            <p class="muted pediatric-form-subtitle" id="pediatric-form-subtitle">Συμπλήρωσε τα στοιχεία της καταχώρησης.</p>
        </div>
    </div>
    <div id="weekday-preview" class="weekday-preview" hidden>
        <span>Ημέρα:</span>
        <strong id="weekday-preview-value"></strong>
    </div>
    <form method="post" id="entry-form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button class="btn primary" type="submit">💾 Αποθήκευση</button>
            <a class="btn secondary" href="javascript:history.back()">↩️ Ακύρωση</a>
        </div>
    </form>
</div>

<script>
(function () {
    const formCard = document.getElementById("entry-form-card");
    const formIcon = document.getElementById("pediatric-form-icon");
    const formSubtitle = document.getElementById("pediatric-form-subtitle");

    if (formCard) {
        if (document.getElementById("id_value")) {
            formCard.classList.add("glucose-form-card");
            if (formIcon) formIcon.textContent = "🩸";
            if (formSubtitle) formSubtitle.textContent = "Καταγραφή μέτρησης γλυκόζης με ώρα, σχέση με γεύμα και σημειώσεις.";
        } else if (document.getElementById("id_offered_ml")) {
            formCard.classList.add("meal-form-card");
            if (formIcon) formIcon.textContent = "🍼";
            if (formSubtitle) formSubtitle.textContent = "Καταγραφή ώρας, ποσότητας και στοιχείων του γεύματος.";
        } else if (document.getElementById("id_kind")) {
            formCard.classList.add("diaper-form-card");
            if (formIcon) formIcon.textContent = "👶";
            if (formSubtitle) formSubtitle.textContent = "Καταγραφή πάνας, κένωσης και σχετικών παρατηρήσεων.";
        } else if (document.getElementById("id_symptom")) {
            formCard.classList.add("symptom-form-card");
            if (formIcon) formIcon.textContent = "🌡️";
            if (formSubtitle) formSubtitle.textContent = "Συμπλήρωσε τι παρατηρήθηκε στο επεισόδιο.";
        }
    }

    // Explicit feeding routes. Only entered values can establish a breakdown;
    // do not auto-fill historic unknown amounts when editing old entries.
    const oralInput = document.getElementById("id_oral_ml");
    const tubeInput = document.getElementById("id_tube_ml");
    const tubeRouteInput = document.getElementById("id_tube_route");
    let autoRouteUpdate = null;
    if (oralInput && tubeInput) {
        const routeRow = tubeRouteInput ? tubeRouteInput.closest("p") : null;
        const note = document.createElement("small");
        note.className = "meal-calculation-note";
        note.setAttribute("aria-live", "polite");
        (tubeInput.closest("p") || tubeInput).appendChild(note);

        function syncRouteVisibility() {
            const hasTube = tubeInput.value !== "" && Number(tubeInput.value) > 0;
            if (routeRow) routeRow.hidden = !hasTube;
            if (!hasTube && tubeRouteInput) tubeRouteInput.value = "";
        }
        function syncRouteTotals() {
            syncRouteVisibility();
            if (oralInput.value === "" && tubeInput.value === "") {
                note.textContent = "";
                return;
            }
            const oral = oralInput.value === "" ? 0 : Number(oralInput.value);
            const tube = tubeInput.value === "" ? 0 : Number(tubeInput.value);
            if (!Number.isInteger(oral) || !Number.isInteger(tube) || oral < 0 || tube < 0) {
                note.textContent = "⚠️ Συμπλήρωσε μη αρνητικά ακέραια ml.";
                return;
            }
            const total = oral + tube;
            const consumed = document.getElementById("id_consumed_ml");
            const offered = document.getElementById("id_offered_ml");
            const remaining = document.getElementById("id_remaining_ml");
            if (offered && offered.value !== "" && total > Number(offered.value)) {
                note.textContent = "⚠️ Η συνολική χορήγηση είναι μεγαλύτερη από τα προσφερθέντα ml.";
                return;
            }
            if (consumed) {
                consumed.value = String(total);
                consumed.dispatchEvent(new Event("input", { bubbles: true }));
            }
            if (remaining && offered && offered.value !== "") {
                remaining.value = String(Number(offered.value) - total);
            }
            note.textContent = "Από στόμα " + oral + " ml + μέσω σωλήνα " + tube + " ml = " + total + " ml συνολικά.";
        }
        // Defaults apply only to a new, unsubmitted meal. An edited existing
        // record or an invalid POST must retain its explicitly entered amounts.
        let autoRouteEnabled = formCard?.dataset.newMealRouteDefaults === "true";
        let applyingRouteDefault = false;
        const markManualSplit = function () {
            if (!applyingRouteDefault) autoRouteEnabled = false;
        };
        oralInput.addEventListener("input", markManualSplit);
        tubeInput.addEventListener("input", markManualSplit);
        if (tubeRouteInput) tubeRouteInput.addEventListener("change", markManualSplit);
        oralInput.addEventListener("input", syncRouteTotals);
        tubeInput.addEventListener("input", syncRouteTotals);
        const offeredInput = document.getElementById("id_offered_ml");
        if (offeredInput) offeredInput.addEventListener("input", syncRouteTotals);

        function applyAutomaticRoute() {
            if (!autoRouteEnabled) return;
            const scheduledInput = document.getElementById("id_scheduled_time");
            const actualInput = document.getElementById("id_actual_time");
            const sameAsScheduled = document.getElementById("id_same_as_scheduled");
            const consumedInput = document.getElementById("id_consumed_ml");
            const remainingInput = document.getElementById("id_remaining_ml");
            const selectedTime = (
                sameAsScheduled && !sameAsScheduled.checked && actualInput?.value
                    ? actualInput.value : scheduledInput?.value
            ) || "";
            const match = selectedTime.match(/^(\d{1,2}):(\d{2})/);
            if (!match || !consumedInput || consumedInput.value === "") return;
            const hour = Number(match[1]), minute = Number(match[2]);
            const amount = Number(consumedInput.value);
            if (!Number.isInteger(amount) || amount < 0 ||
                hour > 23 || minute > 59) return;
            const minutes = hour * 60 + minute;
            const overnight = minutes >= 18 * 60 + 50 || minutes <= 7 * 60 + 30;
            applyingRouteDefault = true;
            oralInput.value = overnight ? "0" : String(amount);
            tubeInput.value = overnight ? String(amount) : "0";
            if (tubeRouteInput) tubeRouteInput.value = overnight && amount > 0 ? "gastrostomy" : "";
            if (remainingInput && offeredInput && offeredInput.value !== "" &&
                amount <= Number(offeredInput.value)) {
                remainingInput.value = String(Number(offeredInput.value) - amount);
            }
            syncRouteVisibility();
            applyingRouteDefault = false;
            note.textContent = (overnight ? "🌙 Νυχτερινή" : "☀️ Ημερήσια") +
                " προεπιλογή: " + amount + " ml " +
                (overnight ? "μέσω γαστροστομίας" : "από το στόμα") +
                ". Επιβεβαίωσε την πραγματική χορήγηση πριν την αποθήκευση.";
        }

        // Registered after the remainder calculation handlers below.
        autoRouteUpdate = applyAutomaticRoute;
        syncRouteVisibility();
    }

    const sameBox = document.getElementById("id_same_as_scheduled");
    const scheduled = document.getElementById("id_scheduled_time");
    const actual = document.getElementById("id_actual_time");

    if (sameBox && scheduled && actual) {
        function syncActualTime() {
            if (sameBox.checked) {
                actual.value = scheduled.value;
                actual.readOnly = true;
                actual.classList.add("input-synced");
            } else {
                actual.readOnly = false;
                actual.classList.remove("input-synced");
            }
        }

        sameBox.addEventListener("change", syncActualTime);
        scheduled.addEventListener("input", syncActualTime);
        scheduled.addEventListener("change", syncActualTime);
        syncActualTime();
    }

    const dateInput = document.getElementById("id_date");
    const preview = document.getElementById("weekday-preview");
    const previewValue = document.getElementById("weekday-preview-value");
    const weekdays = [
        "Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη",
        "Πέμπτη", "Παρασκευή", "Σάββατο"
    ];

    function updateWeekday() {
        if (!dateInput || !preview || !previewValue || !dateInput.value) {
            if (preview) preview.hidden = true;
            return;
        }
        const p = dateInput.value.split("-");
        if (p.length !== 3) {
            preview.hidden = true;
            return;
        }
        const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
        if (Number.isNaN(d.getTime())) {
            preview.hidden = true;
            return;
        }
        previewValue.textContent = weekdays[d.getDay()];
        preview.hidden = false;
    }

    if (dateInput) {
        dateInput.addEventListener("input", updateWeekday);
        dateInput.addEventListener("change", updateWeekday);
        updateWeekday();
    }


    // Meal entry helper:
    // when "Έμεινε (ml)" is filled, calculate "Ήπιε" = Προσφέρθηκαν - Έμεινε.
    const offeredMl = document.getElementById("id_offered_ml");
    const remainingMl = document.getElementById("id_remaining_ml");
    const consumedMl = document.getElementById("id_consumed_ml");

    if (offeredMl && remainingMl && consumedMl) {
        const consumedRow = consumedMl.closest("p");
        let calculationNote = document.getElementById("meal-remaining-calculation");

        if (!calculationNote && consumedRow) {
            calculationNote = document.createElement("small");
            calculationNote.id = "meal-remaining-calculation";
            calculationNote.className = "meal-calculation-note";
            consumedRow.appendChild(calculationNote);
        }

        function numberValue(input) {
            if (!input || input.value === "") return null;
            const value = Number(input.value);
            return Number.isFinite(value) ? value : null;
        }

        function calculateConsumedFromRemaining() {
            const offered = numberValue(offeredMl);
            const remaining = numberValue(remainingMl);

            if (offered === null || remaining === null) {
                if (calculationNote) calculationNote.textContent = "";
                consumedMl.classList.remove("input-auto-calculated");
                return;
            }

            if (remaining > offered) {
                if (calculationNote) {
                    calculationNote.textContent = "⚠️ Το υπόλοιπο δεν μπορεί να είναι μεγαλύτερο από όσα προσφέρθηκαν.";
                }
                consumedMl.classList.remove("input-auto-calculated");
                return;
            }

            const consumed = Math.max(offered - remaining, 0);
            consumedMl.value = String(consumed);
            consumedMl.classList.add("input-auto-calculated");

            if (calculationNote) {
                calculationNote.textContent =
                    offered + " ml − " + remaining + " ml = " + consumed + " ml ήπιε";
            }
        }

        function calculateRemainingFromConsumed() {
            // Preserve the old workflow too: if the user clears "Έμεινε" and
            // enters "Ήπιε" manually, the server will calculate the remainder.
            if (remainingMl.value !== "") return;

            const offered = numberValue(offeredMl);
            const consumed = numberValue(consumedMl);
            if (offered === null || consumed === null || consumed > offered) {
                if (calculationNote) calculationNote.textContent = "";
                return;
            }

            if (calculationNote) {
                calculationNote.textContent =
                    "Έμεινε " + (offered - consumed) + " ml";
            }
        }

        offeredMl.addEventListener("input", function () {
            if (remainingMl.value !== "") {
                calculateConsumedFromRemaining();
            } else {
                calculateRemainingFromConsumed();
            }
        });
        remainingMl.addEventListener("input", calculateConsumedFromRemaining);
        remainingMl.addEventListener("change", calculateConsumedFromRemaining);
        consumedMl.addEventListener("input", calculateRemainingFromConsumed);

        calculateConsumedFromRemaining();
    }

    if (formCard?.dataset.newMealRouteDefaults === "true" && autoRouteUpdate) {
        [scheduled, actual, sameBox, offeredMl, remainingMl, consumedMl]
            .filter(Boolean).forEach(input => {
                input.addEventListener("input", autoRouteUpdate);
                input.addEventListener("change", autoRouteUpdate);
            });
        autoRouteUpdate();
    }

    // Live energy preview for the meal being recorded. This is an estimate
    // from consumed ml, not a prescribed amount or an additional NG feed.
    const formulaScoopsInput = document.getElementById("id_formula");
    const maxijulScoopsInput = document.getElementById("id_supplement");
    const preparedVolumeInput = document.getElementById("id_prepared_volume_ml");
    const mealStatusInput = document.getElementById("id_status");
    if (consumedMl && formulaScoopsInput && maxijulScoopsInput && preparedVolumeInput) {
        const energyPreview = document.createElement("div");
        energyPreview.className = "medical-note";
        energyPreview.style.cssText =
            "margin:12px 0;padding:14px 16px;border-radius:12px;border:1px solid rgba(128,128,128,.22);";
        energyPreview.setAttribute("aria-live", "polite");
        const target = preparedVolumeInput.closest("p") || consumedMl.closest("p");
        if (target) target.insertAdjacentElement("afterend", energyPreview);

        function scoopsNumber(raw, gramsPerScoop, emptyMeansZero) {
            const value = String(raw || "").trim().toLowerCase().replace(",", ".");
            if (!value) return emptyMeansZero ? 0 : null;
            if (["0", "0.0", "χωρίς", "none", "no"].includes(value)) return 0;
            const onlyGrams = value.match(/^(\d+(?:\.\d+)?)\s*(g|gr|γραμμάρια)$/);
            if (onlyGrams) return Number(onlyGrams[1]) / gramsPerScoop;
            const match = value.match(/(?:^|[^\w])(\d+(?:\.\d+)?)/);
            if (!match) return null;
            const count = Number(match[1]);
            return Number.isFinite(count) && count >= 0 && count <= 30 ? count : null;
        }

        function previewMealEnergy() {
            const consumed = consumedMl.value.trim() !== "" ? Number(consumedMl.value) : NaN;
            const formula = scoopsNumber(formulaScoopsInput.value, 4.33, false);
            const maxijul = scoopsNumber(maxijulScoopsInput.value, 5, true);
            let finalMl = preparedVolumeInput.value.trim() !== ""
                ? Number(preparedVolumeInput.value) : NaN;
            if (!Number.isFinite(finalMl)) {
                if (formula === 6 && maxijul === 1) finalMl = 205;
                else if (formula === 5 && maxijul === 1) finalMl = 175;
            }
            if (mealStatusInput?.value === "missed" || !Number.isFinite(consumed) ||
                consumed < 0 || formula === null || formula <= 0 || maxijul === null ||
                !Number.isFinite(finalMl) || finalMl <= 0) {
                energyPreview.textContent =
                    "🔥 Εκτιμώμενες θερμίδες: — (συμπλήρωσε πόσα ml καταναλώθηκαν, " +
                    "μεζούρες Frisolac AC / Maxijul και τελικό όγκο παρασκευής).";
                return;
            }
            const ratio = consumed / finalMl;
            const kcal = (formula * 4.33 * 503 / 100 + maxijul * 5 * 380 / 100) * ratio;
            const cho = (formula * 4.33 * 56.2 / 100 + maxijul * 5 * 95 / 100) * ratio;
            energyPreview.textContent =
                "🔥 Εκτιμώμενες θερμίδες για " + consumed + " ml: " +
                kcal.toFixed(1).replace(".", ",") + " kcal · " +
                cho.toFixed(1).replace(".", ",") + " g υδατάνθρακες. " +
                "Μπιμπερό και ρινογαστρικός μετρώνται μία φορά στα συνολικά ml. " +
                "Η τιμή δεν είναι οδηγία αλλαγής της σίτισης.";
        }
        [
            consumedMl, offeredMl, remainingMl, formulaScoopsInput,
            maxijulScoopsInput, preparedVolumeInput, mealStatusInput
        ].filter(Boolean).forEach(input => {
            input.addEventListener("input", previewMealEnergy);
            input.addEventListener("change", previewMealEnergy);
        });
        previewMealEnergy();
    }

    const finishedTime = document.getElementById("id_finished_time");
    if (finishedTime) {
        const finishRow = finishedTime.closest("p");
        if (finishRow && !document.getElementById("set-finish-now")) {
            const nowButton = document.createElement("button");
            nowButton.type = "button";
            nowButton.id = "set-finish-now";
            nowButton.className = "mini-action finish-now-button";
            nowButton.textContent = "Τέλος τώρα";
            nowButton.addEventListener("click", function () {
                const now = new Date();
                finishedTime.value =
                    String(now.getHours()).padStart(2, "0") + ":" +
                    String(now.getMinutes()).padStart(2, "0");
                finishedTime.dispatchEvent(new Event("change", {bubbles: true}));
            });
            finishRow.appendChild(nowButton);

            const note = document.createElement("small");
            note.className = "finish-time-note";
            note.textContent = "Η ώρα τέλους είναι μόνο καταγραφή και δεν αλλάζει το σταθερό πρόγραμμα γευμάτων.";
            finishRow.appendChild(note);
        }
    }

    const doctorChoice = document.getElementById("id_doctor_choice");
    const otherDoctor = document.getElementById("id_other_doctor");
    const otherClinic = document.getElementById("id_other_clinic");

    function paragraphFor(element) {
        return element ? element.closest("p") : null;
    }

    function updateDoctorFields() {
        if (!doctorChoice) return;

        const showOther = doctorChoice.value === "other";
        const doctorRow = paragraphFor(otherDoctor);
        const clinicRow = paragraphFor(otherClinic);

        if (doctorRow) doctorRow.hidden = !showOther;
        if (clinicRow) clinicRow.hidden = !showOther;

        if (otherDoctor) otherDoctor.required = showOther;
    }

    if (doctorChoice) {
        doctorChoice.addEventListener("change", updateDoctorFields);
        updateDoctorFields();
    }
})();
</script>
{% endblock %}
