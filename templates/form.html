{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-card">
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button class="btn primary" type="submit">Αποθήκευση</button>
            <a class="btn secondary" href="javascript:history.back()">Ακύρωση</a>
        </div>
    </form>
</div>
{% endblock %}
