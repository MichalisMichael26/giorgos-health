{% extends "base.html" %}
{% block title %}Σύνδεση{% endblock %}
{% block content %}
<div class="hero-banner">
    <div>
        <h1>Καλωσήρθατε στο Giorgos Health</h1>
        <p class="muted large-text">Ένα γλυκό και οργανωμένο ημερολόγιο για γεύματα, γλυκόζη και ανάπτυξη.</p>
    </div>
</div>

<div class="form-card narrow login-card">
    <h2>Σύνδεση</h2>
    <p class="muted">Ιδιωτική πρόσβαση στο Giorgos Health.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn primary" type="submit">Σύνδεση</button>
    </form>
</div>
{% endblock %}
