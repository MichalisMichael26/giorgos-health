services:
  - type: web
    name: giorgos-health
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn giorgos_health.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: giorgos-health-db
          property: connectionString

databases:
  - name: giorgos-health-db
    databaseName: giorgos_health
    user: giorgos_health_user
