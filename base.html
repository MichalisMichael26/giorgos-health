{% load static %}
<!doctype html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Giorgos Health{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">👶 Giorgos Health</a>
    {% if user.is_authenticated %}
    <nav>
        <a href="{% url 'dashboard' %}">Αρχική</a>
        <a href="{% url 'meal_list' %}">Γεύματα</a>
        <a href="{% url 'glucose_list' %}">Γλυκόζη</a>
        <a href="{% url 'growth_list' %}">Ανάπτυξη</a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
            {% csrf_token %}
            <button class="link-button" type="submit">Έξοδος</button>
        </form>
    </nav>
    {% endif %}
</header>

<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
