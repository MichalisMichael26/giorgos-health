name: Giorgos storage regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giorgos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      ENABLE_PUSH_SCHEDULER: "false"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/giorgos_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Test audit timezones and doctor log retention
        run: python manage.py test core.test_log_retention core.test_dashboard_reminders --verbosity 2
